name: bump

# Keeps every cask in this tap pointed at its app's latest GitHub release.
# Release scripts trigger this via workflow_dispatch; the cron is the backstop.
# Each download URL is derived from the cask's url template plus the latest
# release tag — renaming a release asset or changing a tag scheme in an app
# repo breaks its cask silently.
#
# GitHub disables scheduled workflows after 60 days without repo activity,
# which would also block the release-script dispatch. The keepalive step
# re-enables this workflow via the API on every run, resetting that timer
# without creating commits.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Update casks to latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # cask file | app repo | asset prefix
          casks="
          micguard|milan0x/MicGuard|MicGuard
          local-cloud-browser|milan0x/local-cloud-browser|LocalCloudBrowser
          "
          changed=0
          while IFS='|' read -r cask repo prefix; do
            [ -z "$cask" ] && continue
            file="Casks/${cask}.rb"
            tag=$(gh api "repos/${repo}/releases/latest" --jq .tag_name)
            version="${tag#v}"
            current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$file")
            if [ "$version" = "$current" ]; then
              echo "${cask} already at ${current}"
              continue
            fi
            url="https://github.com/${repo}/releases/download/${tag}/${prefix}-${version}.dmg"
            sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
            sed -i "s/^  version \".*\"/  version \"${version}\"/" "$file"
            sed -i "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" "$file"
            echo "${cask}: ${current} -> ${version}"
            changed=1
          done <<< "$casks"
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Casks
            git commit -m "Bump casks to latest releases"
            git push
          fi

      - name: Keep workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bump.yml/enable"
